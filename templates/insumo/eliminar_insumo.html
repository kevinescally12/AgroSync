{% extends 'layout/base.html' %}

{% block content %}
  <h2 class="text-xl font-bold mb-4">Eliminar Insumo</h2>

  <p>¿Estás seguro de que deseas eliminar el insumo <strong>{{ insumo.nombre }}</strong>?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'listar_insumos' %}" class="btn btn-secondary">Cancelar</a>
  </form>
{% endblock %}
