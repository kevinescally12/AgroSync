{% extends 'layout/base.html' %}
{% load static %}

{% block content %}
  <h2 class="text-xl font-bold mb-4">Editar Insumo: {{ insumo.nombre }}</h2>

  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Actualizar</button>
  </form>

  <a href="{% url 'listar_insumos' %}">← Volver a la lista</a>
{% endblock %}
