<h2>Mis terrenos</h2>

{% if terrenos %}
    <ul>
    {% for terreno in terrenos %}
        <li>{{ terreno.nombre }} - {{ terreno.ubicacion }}</li>
        <a href="{% url 'detalle_terreno' terreno.id %}">Ver detalles</a>
    {% endfor %}
    </ul>
{% else %}
    <p>No tienes terrenos registrados.</p>
{% endif %}
